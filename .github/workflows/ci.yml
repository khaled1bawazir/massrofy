# Massrofy CI
#
# Runs on every pull request into `main` and on every push to `main` (the
# latter mainly so `main` itself always shows a green/red status, not because
# we expect direct pushes — branch protection should block those, see
# .github/CI_CD.md).
#
# What this pipeline does, in order:
#   1. flutter-build-test  — flutter pub get / analyze / format check / test
#      (with coverage) / debug APK build. The "does the app actually work"
#      check. See docs/build-plan.md P1: "A PR with a failing test cannot be
#      merged."
#   2. dependency-scan      — OSV-Scanner over pubspec.lock: a dependency /
#      security scan, required in banking CI.
#   3. money-type-guard      — enforces docs/architecture.md ADR-002: money is
#      exact-decimal (package:decimal); `double`/`num` are banned by CI in
#      money-critical code paths.
#   4. no-network-permission-guard — enforces docs/architecture.md ADR-001: the
#      release build must never carry INTERNET / ACCESS_NETWORK_STATE.
#   5. ci                    — a single fan-in job that fails if any of the
#      above failed. THIS is the job branch protection should require (see
#      .github/CI_CD.md) — one required check name, however many jobs run
#      inside it.
#
# KHA-62 / KHA-67 (2026-07-28): the Android emulator job (4b below) boots a
# real, nested-KVM-virtualized emulator on a shared GitHub-hosted runner, which
# is intermittently flaky in ways unrelated to this repo's code (QEMU hangs
# mid-boot). It (a) only runs on a PR when the PR actually touches android/,
# lib/, integration_test/, or pubspec.*, and (b) retries once, against a torn-
# down runner and a freshly created AVD, before failing the job for real.
#
# A NOTE THAT APPLIES TO EVERY `timeout-minutes:` IN THIS FILE, learned the
# hard way in KHA-67: `timeout-minutes` is when GitHub starts CANCELLING a
# job or step, not when it stops. If the runner cannot stop the step, GitHub
# force-terminates 5 minutes later — which is why a job declaring 55 was
# killed at exactly 60m00s. Budget against that, and prefer deadlines the
# step enforces on itself (a `timeout` wrapper, an action's own boot timeout)
# over the runner's, because only the former fail cleanly and leave a log.
# See the emulator job's comment block for the full evidence.
#
# All four content jobs (1-4) are written to be safe to run on this repo
# *before* the Flutter project exists (mobile-engineer's P1 scaffold): they
# detect the absence of pubspec.yaml / lib/ / android/ and skip cleanly rather
# than failing, and each one starts enforcing for real the moment the relevant
# files land. Nothing here is "green because it didn't check anything and
# nobody noticed" forever — see the "detect" step logs on every run.
#
# Secrets: this workflow needs none. It never builds a *signed* artifact —
# that only happens in deploy.yml, gated behind GitHub Actions secrets that are
# never printed to logs.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR so the pipeline stays fast and
# CI minutes aren't wasted building a commit nobody cares about anymore.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build + test. The core "is the app correct" gate.
  # ---------------------------------------------------------------------------
  flutter-build-test:
    name: flutter build & test
    runs-on: ubuntu-latest
    # KHA-65: this job and no-network-permission-guard had no explicit
    # timeout and inherited GitHub's 360-minute default, exactly the class
    # of bug KHA-62 already fixed for the emulator job -- both have now
    # hung in_progress (not failed) on a docs-only PR that can't possibly
    # affect either. Observed healthy duration is under 15 min; 30 is
    # headroom, not a squeeze.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check whether the Flutter project exists yet
        id: detect
        run: |
          if [ -f pubspec.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No pubspec.yaml at repo root yet — Flutter app not scaffolded (mobile-engineer's P1 work). Nothing to build or test yet; this step passes so the pipeline itself isn't blocked before there is any app code. It will start doing real work the moment pubspec.yaml lands."
          fi

      - name: Set up Java (required by the Android toolchain)
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        if: steps.detect.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: flutter pub get
        if: steps.detect.outputs.exists == 'true'
        run: flutter pub get

      - name: "dart format --set-exit-if-changed (lint: formatting)"
        if: steps.detect.outputs.exists == 'true'
        run: dart format --set-exit-if-changed .

      - name: "flutter analyze (lint: static analysis)"
        if: steps.detect.outputs.exists == 'true'
        run: flutter analyze --fatal-infos

      - name: flutter test --coverage
        if: steps.detect.outputs.exists == 'true'
        # --exclude-tags=release_mode_guard: excludes exactly one file,
        # test/features/security/privacy_overlay_release_mode_test.dart,
        # which self-checks and deliberately FAILS under a plain
        # `flutter test` (see its doc comment and dart_test.yaml) — it only
        # makes sense run with dart.vm.product=true, which the dedicated
        # step immediately below this one supplies.
        run: flutter test --coverage --exclude-tags=release_mode_guard

      - name: "ADR-014: app-switcher privacy overlay guard under genuine release-mode semantics"
        if: steps.detect.outputs.exists == 'true'
        # This is a SEPARATE `flutter test` invocation, deliberately: passing
        # --dart-define=dart.vm.product=true genuinely flips `kReleaseMode`
        # to true for this process (verified empirically — see
        # test/features/security/privacy_overlay_release_mode_test.dart's
        # doc comment), which is exactly the release-mode semantics ADR-014's
        # "no shipped bypass" guarantee depends on. Running it mixed into the
        # main `flutter test --coverage` step above would make every OTHER
        # test in the suite unknowingly run under dart.vm.product=true too,
        # which is not what "flutter test --coverage" should mean for the
        # rest of this suite.
        run: >
          flutter test
          --dart-define=dart.vm.product=true
          --dart-define=MASSROFY_DISABLE_PRIVACY_OVERLAY=true
          test/features/security/privacy_overlay_release_mode_test.dart

      - name: Upload coverage report
        if: steps.detect.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 30

      - name: flutter build apk --debug (build sanity check)
        if: steps.detect.outputs.exists == 'true'
        run: flutter build apk --debug

  # ---------------------------------------------------------------------------
  # 2. Dependency / security scan (banking requirement — never skip this).
  # ---------------------------------------------------------------------------
  dependency-scan:
    name: dependency & security scan
    runs-on: ubuntu-latest
    # KHA-65: same "no explicit timeout" gap as the other jobs. Observed
    # duration is under 5 min; `go install` fetching over the network is
    # the one step here with any real variance, so this has more headroom
    # than its normal runtime, not zero.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check whether there is a lockfile to scan yet
        id: detect
        run: |
          if [ -f pubspec.lock ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No pubspec.lock yet — nothing to scan. Will activate once the Flutter project and its dependencies exist."
          fi

      # OSV-Scanner checks pubspec.lock (and any other manifest/lockfiles it
      # finds) against the OSV.dev vulnerability database. This is the
      # dependency/security scan required for a banking-domain CI pipeline.
      #
      # Installed as a CLI via `go install` rather than a marketplace action:
      # OSV-Scanner's GitHub integration is only published as job-level
      # reusable workflows (jobs.<id>.uses:), which cannot be invoked as a
      # step inside another job's steps list. The CLI avoids that mismatch
      # and needs no separate action version to track.
      - name: Install OSV-Scanner
        if: steps.detect.outputs.exists == 'true'
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: OSV-Scanner
        if: steps.detect.outputs.exists == 'true'
        run: osv-scanner scan source -r ./

  # ---------------------------------------------------------------------------
  # 3. ADR-002: money is exact-decimal; double/num banned by construction + CI.
  # ---------------------------------------------------------------------------
  money-type-guard:
    name: "ADR-002: money-type guard (double/num ban)"
    runs-on: ubuntu-latest
    # A grep-based shell script with no network/emulator dependency; this is
    # generous headroom purely for consistency with every other job in this
    # file now having an explicit timeout (KHA-65), not because this one has
    # ever been slow.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run ADR-002 grep guard
        run: bash .github/scripts/check_money_type_ban.sh

  # ---------------------------------------------------------------------------
  # 4b. Everything that can only be proven on a real Android device.
  #
  # KHA-75 (2026-07-28) widened this job from one named file to the whole
  # `integration_test/` directory, and the reason is worth keeping: this job
  # is the ONLY place in CI where Dart code meets the real Android platform,
  # and the only place a Dart↔Kotlin platform-channel contract is genuinely
  # exercised. KHA-75 was a channel-encoding mismatch (`Uint8List` sent,
  # `java.util.List` expected) that broke the app lock on 100% of devices
  # while every host-side test stayed green — because a fake MethodChannel
  # never crosses the codec boundary. `integration_test/keystore_channel_test.dart`
  # is the guard against a repeat, and it only guards anything if this job
  # actually runs it. Any future `integration_test/*.dart` is picked up
  # automatically now, rather than needing this file edited too (and being
  # silently un-run when nobody remembers).
  #
  # ADR-003: SQLCipher encryption, exercised for real on Android.
  #
  # `flutter test` (job 1 above) runs on the HOST runner's Dart VM, where
  # this Android-only app has no genuine SQLCipher native library to load —
  # see test/data/db/app_database_encryption_test.dart's doc comment. Those
  # tests are honestly marked skipped in that environment rather than
  # forced green. THIS job is the real, required, gating coverage: it boots
  # an actual headless Android emulator and runs
  # integration_test/db_encryption_test.dart against it, where
  # `sqlcipher_flutter_libs`' precompiled Android binary genuinely is
  # present — the exact same binary the shipped app uses. If SQLCipher is
  # ever misconfigured on code this job actually runs against, this job
  # fails; it never silently skips *that*. It DOES legitimately skip its
  # real work in two cases, both intentional (see KHA-62):
  #   - pubspec.yaml doesn't exist yet (pre-scaffold repo state, same as
  #     every other job here), or
  #   - on a pull_request, this PR's diff doesn't touch anything this job
  #     could possibly affect (android/, lib/, integration_test/,
  #     pubspec.yaml/.lock, or this workflow file). A README-only or
  #     docs-only PR gains nothing from booting an emulator, and every run of
  #     this job is a real, non-trivial chance of hitting the flakiness
  #     described below. Push events (merges to main) are NOT path-filtered —
  #     every merge still gets the real emulator run, since that's the
  #     lowest-frequency, highest-stakes trigger and defense-in-depth is
  #     worth the extra minutes there.
  #
  # KHA-62 — known flakiness and how this job now handles it:
  # reactivecircus/android-emulator-runner boots a nested-KVM-virtualized
  # Android emulator inside GitHub's shared, standard (2-vCPU) runner VM.
  # Twice now, on two different PRs, this job has failed with the emulator's
  # QEMU process hanging mid-boot and never recovering:
  #   ERROR | detected a hanging thread 'QEMU2 main loop'. No response for ...
  #   ERROR | detected a hanging thread 'QEMU2 CPU0 thread'. No response for ...
  #   ##[error]The runner has received a shutdown signal...
  # Once under contention from other PRs' CI running concurrently, once with
  # no other PR CI running at all — so runner contention alone doesn't
  # explain it; this is a documented, general pain point of this action on
  # GitHub's shared standard runners (nested virtualization getting starved
  # of CPU time by the host). It is NOT diff-related: one hang happened on a
  # docs-only PR, the other on a CI-workflow-only PR, both well before the
  # Dart test itself ever ran. The exact same job has also passed cleanly
  # many times (12m57s-15m02s), so this is genuine intermittent flakiness,
  # not a systemic break — which is exactly the situation a retry fixes: a
  # hang that doesn't resolve is far less likely to recur 2-3 times in a row
  # than once. There is no input on the action itself that makes QEMU immune
  # to this, and GitHub Actions has no native "retry this step" primitive for
  # a `uses:` step, so the retry is done by hand below: up to 3 attempts of
  # the same step, each skipped once an earlier one has already succeeded.
  #
  # Considered and NOT done here:
  #   - Changing api-level/target/arch/profile: the failure is a QEMU-level
  #     hang during boot, not something specific to this combination; no
  #     evidence points at it being the cause.
  #   - GitHub's larger/paid runners (more vCPUs materially reduces nested-
  #     virtualization contention and would likely help) — left as a flagged
  #     option, not implemented, since it costs money and is an org billing
  #     decision, not a workflow-file decision.
  #
  # KHA-67 (2026-07-28) — what KHA-62's retry design got wrong, corrected here.
  # PR #11's run of this job (run 30379373737, job 90343139912) declared
  # `timeout-minutes: 55` and was killed at exactly 60m00s. Reading the real
  # timings and the log of the comparable run on `main` (job 90326515099)
  # turned up three separate defects, all fixed below:
  #
  #   1. `timeout-minutes` is when GitHub starts CANCELLING, not when the job
  #      stops. The check annotation on job 90343139912 reads "The job has
  #      exceeded the maximum execution time of 55m0s" — so 55 was honoured
  #      exactly, at 17:35:49Z. The runner then could not stop the wedged
  #      emulator step, and GitHub force-terminated the job after its fixed
  #      5-minute cancellation grace, at 17:40:49Z. 60 = 55 + 5. Every budget
  #      in this job is now written against that fact, and the grace is
  #      stated wherever a number is declared, so "declared" and "observed"
  #      can never drift apart silently again.
  #
  #   2. The old "3 attempts x 15 min = 45 min ceiling" was never a real
  #      ceiling, for the same reason. Step-level `timeout-minutes` also only
  #      starts a cancellation: on job 90343139912 attempt 1 declared 15 min
  #      and ran 20m49s (16:42:12Z -> 17:03:01Z), and attempt 2 was still
  #      running 22m48s past its own 15-minute deadline when the job timeout
  #      took over. So the real worst case was 3 x (15 + an unbounded kill
  #      overhang), which is how a "45-minute" budget reached 55. The fix is
  #      NOT to add slack on top of a bound that does not bind — it is to
  #      give the step bounds it enforces ITSELF (`emulator-boot-timeout`,
  #      and a `timeout` wrapper around `script`) and leave the runner's
  #      `timeout-minutes` as a backstop that should never fire.
  #
  #   3. THE RETRY WAS NEVER A CLEAN RETRY. Job 90326515099's log shows
  #      attempt 2 starting while attempt 1's emulator was still alive:
  #        FATAL | Running multiple emulators with the same AVD is an
  #                experimental feature. Please use -read-only flag ...
  #      and then immediately "Emulator booted." — because `adb` found the
  #      STALE emulator still listening on port 5554 and attached to it. The
  #      job-end cleanup confirms it was never reaped in between:
  #        Terminate orphan process: pid (2704) (qemu-system-x86_64-headless)
  #      So a retry after a boot failure was retrying against the very
  #      emulator that had just failed. There is now an explicit teardown
  #      step between attempts, and attempt 2 forces AVD re-creation.
  #
  # Also learned from job 90326515099, and it changes the sizing: attempt 1
  # there was NOT a QEMU hang. It printed
  #   ✅ ADR-003 (on-device): a database created with a key cannot be opened
  #      with the wrong key
  # at 15:55:58Z — the test genuinely PASSED — and was guillotined one second
  # later at 15:55:59Z by "The action ... has timed out after 15 minutes."
  # The step spends most of its budget on a cold Gradle build of the app
  # under test ("Running Gradle task 'assembleDebug'... 728.6s" — 12.1 min on
  # a 2-vCPU runner, and growing with the codebase). A 15-minute step budget
  # was therefore killing HEALTHY attempts, manufacturing exactly the
  # flakiness the retry was added to absorb. The per-attempt budget below is
  # sized off that measurement, not off a round number.
  #
  # Attempts reduced 3 -> 2. Two honest, independent attempts (which is what
  # the teardown fix in (3) finally makes them) are worth more than three
  # attempts that overrun their cap; and with a healthy attempt genuinely
  # costing 13-18 min on these runners, a third attempt buys a little extra
  # flake tolerance for ~27 more minutes of a required check blocking a merge.
  #
  # Still flagged, still not done (it is what would actually make these
  # numbers small): the cold Gradle build is the dominant cost. Gradle
  # build-cache restore on this job, or a larger runner, would cut it
  # materially. Both are deliberately out of scope of a timeout fix.
  # ---------------------------------------------------------------------------
  android-sqlcipher-integration-test:
    # Display name only — the job *id* above is what `needs:` and the
    # aggregate `ci` check reference, so this rename is safe. It is worth
    # doing because the job stopped being SQLCipher-only in KHA-75 and a
    # name that lies about scope is how a job quietly stops being trusted.
    name: "On-device integration tests (Android emulator): ADR-003 SQLCipher + ADR-004 Keystore channel"
    runs-on: ubuntu-latest
    # Without an explicit timeout this job inherits GitHub's 360-minute
    # default, and has previously hung (not failed — genuinely never
    # completed) for 2+ hours on the boot flakiness described above, which
    # silently blocks every merge behind it since a required check stuck
    # `pending` is indistinguishable from "still running fine."
    #
    # Budget (KHA-67). Every term is measured, not guessed; the measurements
    # are from job 90326515099 (push to main @ c6879f3) and job 90343139912
    # (PR #11). Each emulator attempt below now bounds ITSELF, so this job
    # budget is the sum of those internal ceilings, not of the step-level
    # `timeout-minutes` backstops:
    #
    #   setup steps, checkout -> flutter pub get (measured 1m23s)      3 min
    #   attempt 1  — internal ceiling, see the step's own comment     27 min
    #   teardown between attempts (its own timeout-minutes: 2)         2 min
    #   attempt 2  — internal ceiling, same                           27 min
    #   "Fail the job if every attempt failed"                         1 min
    #   post steps (Post Flutter / Post Java / Post checkout)          1 min
    #                                                                -------
    #   worst case                                                    61 min
    #   declared                                                      62 min
    #
    # Read the two numbers this produces, because they are NOT the same
    # number and conflating them is what KHA-67 was:
    #   - 62 min is when GitHub starts cancelling this job.
    #   - up to 67 min is the worst observed wall clock, because GitHub
    #     force-terminates 5 minutes after cancellation begins if the runner
    #     cannot stop the step (this is exactly the 55 -> 60 gap on job
    #     90343139912). Never read a `timeout-minutes` here as a wall clock.
    #
    # Two questions worth answering here rather than leaving to be
    # re-derived by the next person:
    #
    #   - Why count BOTH the boot cap and the script cap in one attempt, when
    #     a boot that times out means the script never runs? Because the
    #     expensive case is not a boot that FAILS — it is a boot that is slow
    #     and then SUCCEEDS (4m59s is legal), followed by a script that
    #     overruns. Those two do compose, so 27 is genuinely reachable and
    #     not a stack of mutually exclusive failures.
    #
    #   - Why is 27 so much larger than a healthy attempt? Because a healthy
    #     attempt is ~13-14 min (measured: 12m48s on job 90359857337,
    #     13m16s on job 90365606440, 13m34s on job 90369329440) and nearly
    #     all of it is the script. SDK install + AVD create + boot together
    #     take ~2 min in practice (job 90369329440: step start 18:07:22Z,
    #     "Emulator booted." 18:09:19Z). The SDK/boot terms above are
    #     ceilings, not expectations.
    #
    # If BOTH attempts skip past their internal ceilings and run all the way
    # to their 30-minute step BACKSTOPS, the step budgets alone would sum to
    # 3 + 30 + 2 + 30 + 1 + 1 = 67, which is over this job's 62 — so this job
    # timeout fires first and is what stops it. Deliberate: this is the
    # outermost backstop. (That 67 and the 67-minute worst-case wall clock
    # above are two different quantities that happen to coincide. Neither is
    # derived from the other.)
    #
    # A healthy run is unaffected and still finishes in ~15-20 minutes.
    #
    # HONEST LIMIT — what none of these budgets can catch. Job 90365056113
    # (this file's own validation run) failed at 11 min with:
    #     18:16:50Z ERROR | detected a hanging thread 'QEMU2 main loop'.
    #                       No response for 16311 ms
    #     18:17:26Z ##[error]The runner has received a shutdown signal.
    # i.e. the KHA-62 QEMU hang, and then the RUNNER VM ITSELF died 36
    # seconds later — the same pairing that ended job 90326515099. When that
    # happens the job ends immediately, `Post` steps are skipped, and neither
    # the `timeout` wrapper nor any `timeout-minutes` gets a chance to act;
    # the retry below cannot help either, because there is no longer a runner
    # to retry on. The one mercy is that it fails FAST (11 min) and RED, which
    # is the behaviour we want anyway. Do not read a quick red on this job as
    # evidence that the budgets here are broken — check for that pair of log
    # lines first. Surviving this properly needs a retry at the JOB level
    # (re-running the workflow), which GitHub has no native primitive for.
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow fetch-depth: 1 — the path
          # filter below diffs this PR's head against its base commit, which
          # requires both commits to actually be present locally.
          fetch-depth: 0

      - name: Check whether the Flutter project exists yet
        id: detect
        run: |
          if [ -f pubspec.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No pubspec.yaml at repo root yet — nothing to run. Will activate once the Flutter project exists."
          fi

      # KHA-62 item 3: on a pull_request, only actually run this job's
      # (slow, occasionally flaky) emulator work when the PR touches
      # something it could plausibly affect. Hand-rolled with `git diff`
      # rather than a third-party paths-filter action, consistent with the
      # rest of this file's plain-bash "detect" steps and to avoid adding
      # another supply-chain dependency for something this small.
      # Push events (merges to main) are deliberately NOT filtered here —
      # see the job-level comment above.
      - name: Determine whether this PR touches files this job exercises
        id: filter
        if: steps.detect.outputs.exists == 'true' && github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files in this PR:"
          echo "$CHANGED_FILES"
          if echo "$CHANGED_FILES" | grep -Eq '^(android/|lib/|integration_test/|pubspec\.(yaml|lock)$|\.github/workflows/ci\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "-> relevant: this PR touches android/, lib/, integration_test/, pubspec.*, or ci.yml itself. Running the real emulator job."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "-> not relevant: this PR touches none of android/, lib/, integration_test/, pubspec.*, or ci.yml. Skipping the emulator work — nothing in this diff could affect it."
          fi

      # GitHub-hosted ubuntu runners support hardware-accelerated
      # (KVM-backed) Android emulators, but the kvm device node needs its
      # permissions relaxed first — this is the standard, documented setup
      # step for reactivecircus/android-emulator-runner on GitHub Actions.
      - name: Enable KVM group permissions
        if: steps.detect.outputs.exists == 'true' && (github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true')
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The ubuntu-latest runner ships ~25 GB of preinstalled toolchains this
      # job never touches (.NET, GHC/Haskell, CodeQL bundles, Android NDK,
      # cached Docker images). Left in place, the runner had ~7.2 GB free —
      # and the emulator aborted at boot with a FATAL
      # "Not enough space to create userdata partition. Available: 7219.46 MB
      # ... need 7372.80 MB", so the integration test never executed at all.
      # Reclaiming this space (plus the explicit `disk-size` below) is what
      # makes the emulator genuinely bootable; it does not weaken the test in
      # any way. Everything removed here is unrelated to a Flutter/Android
      # build: the Android SDK itself and Java are untouched.
      - name: Free disk space for the Android emulator
        if: steps.detect.outputs.exists == 'true' && (github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true')
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules || true
          sudo docker image prune --all --force || true
          echo "Disk after cleanup:"
          df -h /

      - name: Set up Java (required by the Android toolchain)
        if: steps.detect.outputs.exists == 'true' && (github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        if: steps.detect.outputs.exists == 'true' && (github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true')
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: flutter pub get
        if: steps.detect.outputs.exists == 'true' && (github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true')
        run: flutter pub get

      # --- KHA-62 / KHA-67: retry the flaky emulator boot, up to 2 attempts
      #
      # `continue-on-error: true` on attempt 1 means a failed attempt does
      # NOT fail the job by itself — it only lets the next attempt run
      # (guarded by `steps.emulator_attempt_N.outcome == 'failure'`, so a
      # SUCCESSFUL attempt short-circuits the later one via `if:`). The
      # explicit "Fail the job if every attempt failed" step after this block
      # is what actually fails the job — this block by itself would otherwise
      # let the job report success even if the emulator never once booted.
      #
      # Note `outcome` vs `conclusion`: under `continue-on-error: true` the
      # API reports a FAILED step's `conclusion` as "success", which is why
      # job 90343139912's attempt 1 looks green in the REST response even
      # though it failed. `outcome` is the one that carries the truth, and it
      # is the one every `if:` below reads.
      #
      # KHA-67 — each attempt bounds ITSELF, in three layers, innermost
      # first, because only the inner two produce a clean failure with a
      # readable log:
      #   a. `emulator-boot-timeout: 300` — the action's own boot deadline.
      #      This is the one that catches the KHA-62 QEMU boot hang. The
      #      action's default is 600s; a healthy boot on these runners is
      #      well under a minute once the system image is installed, so 10
      #      minutes was pure dead time on the exact failure it exists for.
      #   b. `timeout --kill-after=60s 960s` around `script` — the action has
      #      no deadline of its own for the script phase, and the script
      #      phase is where the time actually goes (a cold
      #      `assembleDebug` measured 728.6s = 12.1 min on job 90326515099,
      #      and it grows with the codebase). 960s = 16 min gives that
      #      measurement ~4 min of headroom; the extra 60s escalates SIGTERM
      #      to SIGKILL for anything that ignores the first signal. `timeout`
      #      exits 124 on expiry, so the action fails normally and the step's
      #      outcome is a plain `failure` — no runner-level kill needed.
      #   c. `timeout-minutes: 30` — a BACKSTOP ONLY, and it should never
      #      fire. It exists for the case where (a) and (b) themselves wedge.
      #
      # Internal ceiling per attempt, which is what the job budget above is
      # summed from:
      #   SDK + system image install, AVD create                       4 min
      #   emulator boot          (capped by emulator-boot-timeout: 300) 5 min
      #   script       (capped by timeout 960s, +60s kill escalation)  17 min
      #   the action's own emulator teardown                            1 min
      #                                                               -------
      #                                                                27 min
      # and the step backstop is 30, i.e. 3 min above that ceiling.
      - name: "Run the SQLCipher integration test on a headless Android emulator (attempt 1 of 2)"
        id: emulator_attempt_1
        if: steps.detect.outputs.exists == 'true' && (github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true')
        continue-on-error: true
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-spellchecker: true
          force-avd-creation: false
          emulator-boot-timeout: 300
          # The `pixel_6` hardware profile asks for a ~7.4 GB userdata
          # partition by default, which is what overflowed the runner's disk
          # (see the cleanup step above). This suite creates a handful of
          # tiny SQLite files; 4 GB is enormously more than it can use, and
          # pinning it makes the job's disk requirement explicit and stable
          # rather than "whatever the device profile happens to default to".
          disk-size: 4096M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: timeout --kill-after=60s 960s flutter test integration_test -d emulator-5554

      # KHA-67 defect 3: without this step, attempt 2 does not get a fresh
      # emulator — it silently re-attaches to attempt 1's. Job 90326515099's
      # log is explicit about it:
      #   FATAL | Running multiple emulators with the same AVD is an
      #           experimental feature. Please use -read-only flag ...
      #   [command] adb -s emulator-5554 shell getprop sys.boot_completed
      #   1
      #   Emulator booted.
      # attempt 2 "booted" in three seconds because it found attempt 1's
      # process still listening on port 5554. The runner only reaped it at
      # the very end of the job ("Terminate orphan process: pid (2704)
      # (qemu-system-x86_64-headless)"). A retry against the emulator that
      # just failed is not a retry.
      #
      # `always()` matters: attempt 1 may have ended by TIMING OUT, and a
      # plain `if:` on outcome alone would not run after a cancelled step.
      # Every command is best-effort and the step ends `exit 0` — a teardown
      # that can fail the build would be worse than the leak it cleans up.
      - name: Tear down attempt 1's emulator before retrying
        if: >
          always() &&
          steps.detect.outputs.exists == 'true' &&
          (github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true') &&
          steps.emulator_attempt_1.outcome == 'failure'
        timeout-minutes: 2
        run: |
          ADB="${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools/adb"
          echo "Devices adb can still see BEFORE teardown:"
          "$ADB" devices || true
          # Ask politely first, then insist. `emu kill` is the only one that
          # gives the emulator a chance to release its AVD lock cleanly.
          "$ADB" -s emulator-5554 emu kill || true
          "$ADB" kill-server || true
          pkill -f qemu-system-x86_64 || true
          pkill -f netsimd || true
          sleep 5
          pkill -9 -f qemu-system-x86_64 || true
          pkill -9 -f netsimd || true
          # Stale lock files/directories inside the AVD are what make a
          # re-created AVD refuse to start; the emulator writes these as
          # directories in current versions, hence -rf rather than -f.
          rm -rf "${ANDROID_AVD_HOME:-$HOME/.android/avd}/test.avd"/*.lock || true
          echo "Devices adb can see AFTER teardown (expect an empty list):"
          "$ADB" devices || true
          exit 0

      - name: "Run the SQLCipher integration test on a headless Android emulator (attempt 2 of 2 — final retry after attempt 1 failed)"
        id: emulator_attempt_2
        if: >
          steps.detect.outputs.exists == 'true' &&
          (github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true') &&
          steps.emulator_attempt_1.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-spellchecker: true
          # KHA-67: attempt 1 reused whatever AVD state was on the runner.
          # If attempt 1 failed, that state is suspect, so this attempt pays
          # the ~15s to build the AVD from scratch. Combined with the
          # teardown above, this is what makes attempt 2 a genuinely
          # independent trial rather than a second look at the same device.
          force-avd-creation: true
          emulator-boot-timeout: 300
          disk-size: 4096M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: timeout --kill-after=60s 960s flutter test integration_test -d emulator-5554

      - name: Fail the job if every attempt failed
        if: >
          always() &&
          steps.detect.outputs.exists == 'true' &&
          (github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true') &&
          steps.emulator_attempt_1.outcome != 'success' &&
          steps.emulator_attempt_2.outcome != 'success'
        run: |
          echo "Both attempts of the SQLCipher emulator integration test failed."
          echo "attempt 1: ${{ steps.emulator_attempt_1.outcome }}"
          echo "attempt 2: ${{ steps.emulator_attempt_2.outcome }}"
          echo ""
          echo "Read the two attempts' logs above before assuming flakiness (KHA-62)."
          echo "Since KHA-67 each attempt fails inside its own deadline and therefore"
          echo "leaves a readable log, and attempt 2 runs against a freshly created AVD"
          echo "on a torn-down runner — so two failures here are much more likely to be"
          echo "a real ADR-003 regression than the same transient boot hang twice."
          exit 1

  # ---------------------------------------------------------------------------
  # 4. ADR-001: release build must never declare INTERNET / ACCESS_NETWORK_STATE.
  # ---------------------------------------------------------------------------
  no-network-permission-guard:
    name: "ADR-001: no-network release manifest guard"
    runs-on: ubuntu-latest
    # KHA-65: no explicit timeout previously -- this is the second job
    # (with flutter-build-test) observed hanging in_progress for 65+ min on
    # a docs-only diff it cannot be affected by. Observed healthy duration
    # is under 10 min.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: flutter pub get
        if: hashFiles('pubspec.yaml') != ''
        run: flutter pub get

      - name: Run ADR-001 no-network manifest guard
        run: bash .github/scripts/check_no_network_permission.sh

  # ---------------------------------------------------------------------------
  # 5. Fan-in — this is the single required status check for branch protection.
  # ---------------------------------------------------------------------------
  ci:
    name: ci
    if: always()
    timeout-minutes: 5
    needs:
      - flutter-build-test
      - dependency-scan
      - money-type-guard
      - no-network-permission-guard
      - android-sqlcipher-integration-test
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every required job passed (or was legitimately skipped)
        run: |
          echo "flutter-build-test: ${{ needs.flutter-build-test.result }}"
          echo "android-sqlcipher-integration-test: ${{ needs.android-sqlcipher-integration-test.result }}"
          echo "dependency-scan: ${{ needs.dependency-scan.result }}"
          echo "money-type-guard: ${{ needs.money-type-guard.result }}"
          echo "no-network-permission-guard: ${{ needs.no-network-permission-guard.result }}"
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required CI jobs failed or was cancelled."
            exit 1
          fi
          echo "All required CI jobs passed."
